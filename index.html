<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Modern Barber, Tustin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141414">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Delius&display=swap" rel="stylesheet">
<style>
:root{--ink:#141414;--white:#f7f5f0;--wood:#9a5532}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--white);font-family:Delius,"Trebuchet MS",sans-serif;
  background-image:radial-gradient(120% 70% at 50% 0%,#2a2b2e 0%,#141414 60%);
  min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 22px calc(28px + env(safe-area-inset-bottom));text-align:center}
.mark{line-height:.9}
.mark .m{font-family:"Great Vibes",cursive;font-size:64px;display:block;margin-bottom:-4px}
.mark .b{font-size:42px;letter-spacing:.12em;display:block;padding-left:.12em}
.rule{width:64px;height:3px;background:var(--wood);border-radius:2px;margin:26px auto 24px}
h1{font-size:26px;font-weight:400;line-height:1.25}
p.sub{text-wrap:balance;font-size:17px;line-height:1.45;color:#cfccc6;margin:10px auto 0;max-width:320px}
.btns{width:100%;max-width:360px;margin:34px auto 0;display:flex;flex-direction:column;gap:14px}
a.btn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:64px;border-radius:14px;
  font-size:19px;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
a.btn:active{transform:scale(.97)}
a.g{background:var(--white);color:var(--ink)}
a.y{border:2px solid #5a5c60;color:var(--white)}
a.btn svg{width:24px;height:24px;flex:none}
footer{margin-top:44px;font-size:14px;line-height:1.6;color:#8d8b87}
footer a{color:#8d8b87}
</style>
</head>
<body>
<div class="mark" role="img" aria-label="Modern Barber"><span class="m">Modern</span><span class="b">BARBER</span></div>
<div class="rule" aria-hidden="true"></div>
<h1>Thanks for coming in.</h1>
<p class="sub">A quick review helps your neighbors find us.</p>
<div class="btns">

    Leave a Google review</a>

</div>
<footer>139 W 1st St, Ste B, Tustin<br><a href="tel:+17148388621">(714) 838-8621</a></footer>
</body>
</html>
